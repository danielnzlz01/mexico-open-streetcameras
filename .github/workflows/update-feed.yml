name: Update Mexico Speed & Red-Light Camera Feed

on:
  schedule:
    # Weekly on Sundays at 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build GATSO_ALL.csv and release bundle
        run: |
          python scripts/build_feed.py \
            --output GATSO_ALL.csv \
            --dist-dir dist \
            --summary-json dist/summary.json

      - name: Validate feed with pytest
        run: pytest -v

      - name: Check if GATSO_ALL.csv changed
        id: diff
        run: |
          if git diff --quiet GATSO_ALL.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated GATSO_ALL.csv to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GATSO_ALL.csv
          COUNT=$(wc -l < GATSO_ALL.csv | tr -d ' ')
          git commit -m "chore(feed): update GATSO_ALL.csv (${COUNT} cameras)"
          git push

      - name: Check whether an initial release exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view >/dev/null 2>&1; then
            echo "has_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release (csv_files.zip for Open Zeekr)
        if: >-
          steps.diff.outputs.changed == 'true' ||
          steps.release_check.outputs.has_release == 'false' ||
          github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date -u +%Y%m%d)-${{ github.run_number }}"
          COUNT=$(wc -l < GATSO_ALL.csv | tr -d ' ')
          NOTES=$(python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path("dist/summary.json").read_text(encoding="utf-8"))
          lines = [
              "Automated Mexico speed & red-light camera dataset for **Open Zeekr** (`csv_files.zip` -> `GATSO_ALL.csv`).",
              "",
              f"- **Total deduplicated cameras:** {s['final_deduplicated_count']}",
              f"- **OpenStreetMap extracted:** {s['osm_extracted']} (ODbL 1.0)",
              f"- **CDMX Fotocívicas extracted:** {s['cdmx_fotocivicas_extracted']} (status: `{s['cdmx_fotocivicas_status']}`)",
              f"- **With known speed limit:** {s['with_known_maxspeed']}",
              f"- **Inside CDMX:** {s['cdmx_bbox_count']}",
              "",
              "`csv_files.zip` contains `GATSO_ALL.csv`, `mx_speed_cameras.csv`, and `ATTRIBUTION.md`.",
          ]
          print("\n".join(lines))
          PY
          )
          gh release create "$TAG" \
            dist/csv_files.zip \
            dist/GATSO_ALL.csv \
            --title "Mexico Speed Cameras (${COUNT} points, #${{ github.run_number }})" \
            --notes "$NOTES"
