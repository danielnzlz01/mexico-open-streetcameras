name: Update Mexico Speed & Red-Light Camera Feed

on:
  schedule:
    # Weekly on Sundays at 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build GATSO_ALL.csv and release bundle
        run: |
          python scripts/build_feed.py \
            --output GATSO_ALL.csv \
            --dist-dir dist \
            --summary-json dist/summary.json

      - name: Validate feed with pytest
        run: pytest -v

      - name: Check if GATSO_ALL.csv changed
        id: diff
        run: |
          if git diff --quiet GATSO_ALL.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to main branch root (GATSO_ALL.csv)
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GATSO_ALL.csv
          COUNT=$(wc -l < GATSO_ALL.csv | tr -d ' ')
          git commit -m "chore(feed): update GATSO_ALL.csv (${COUNT} cameras)"
          git push origin HEAD:main

      - name: Publish to latest GitHub Release (GATSO_ALL.csv & csv_files.zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(wc -l < GATSO_ALL.csv | tr -d ' ')
          LATEST_TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          NOTES=$(python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path("dist/summary.json").read_text(encoding="utf-8"))
          lines = [
              "Automated Mexico speed & red-light camera dataset for **Open Zeekr** (`csv_files.zip` -> `GATSO_ALL.csv` and direct `GATSO_ALL.csv`).",
              "",
              f"- **Total deduplicated cameras:** {s['final_deduplicated_count']}",
              f"- **OpenStreetMap extracted:** {s['osm_extracted']} (ODbL 1.0)",
              f"- **CDMX Fotocívicas extracted:** {s['cdmx_fotocivicas_extracted']} (status: `{s['cdmx_fotocivicas_status']}`)",
              f"- **CDMX Fotomultas metadata matches:** {s.get('fotomultas_enriched', 0)} (status: `{s.get('fotomultas_status', 'n/a')}`)",
              f"- **Nearest-road maxspeed inferred:** {s.get('nearest_road_enriched', 0)}",
              f"- **With known speed limit:** {s['with_known_maxspeed']} ({s.get('known_maxspeed_pct', 0):.1f}%)",
              f"- **Inside CDMX:** {s['cdmx_bbox_count']} | **Edomex:** {s.get('edomex_count', 0)}",
              "",
              "Assets attached: `GATSO_ALL.csv`, `csv_files.zip` (containing `GATSO_ALL.csv`, `mx_speed_cameras.csv`, `ATTRIBUTION.md`), and `mx_speed_cameras.csv`.",
          ]
          print("\n".join(lines))
          PY
          )

          if [ -z "$LATEST_TAG" ] || [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            TAG="v$(date -u +%Y%m%d)-${{ github.run_number }}"
            gh release create "$TAG" \
              dist/GATSO_ALL.csv \
              dist/csv_files.zip \
              dist/mx_speed_cameras.csv \
              --latest \
              --title "Mexico Speed Cameras (${COUNT} points, #${{ github.run_number }})" \
              --notes "$NOTES"
          else
            # Replace assets in place on the latest release so releases/latest/download/GATSO_ALL.csv
            # and csv_files.zip always stay fresh and resolve with HTTP 200 on every run.
            gh release upload "$LATEST_TAG" \
              dist/GATSO_ALL.csv \
              dist/csv_files.zip \
              dist/mx_speed_cameras.csv \
              --clobber
            gh release edit "$LATEST_TAG" --notes "$NOTES"
          fi
